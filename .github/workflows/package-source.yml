# Manual source/dependency transfer only. Never run the map audit or test suite here.
# Automatic push, PR and schedule triggers remain disabled on Local.
name: Package Source Snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lazy-developer-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    if: github.ref == 'refs/heads/Local'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact Local source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use ChatGPT-compatible Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install locked dependencies without arbitrary lifecycle scripts
        run: npm ci --ignore-scripts --include=optional --no-audit --no-fund

      - name: Check script transpiler is loadable
        run: node --input-type=module -e "import('esbuild').then(m => { if (!m.transformSync('const n = 1').code.includes('const n')) process.exitCode = 1; })"

      # Transport must remain possible even if a future source change breaks
      # the canonical TypeScript import. Record that failure instead of
      # mislabeling a successfully uploaded archive as audit-ready.
      # This only imports the source owner; it never runs the audit or tests.
      - name: Probe canonical audit source import
        id: audit-entrypoint
        continue-on-error: true
        shell: bash
        run: |
          node --import tsx --input-type=module <<'NODE'
          const {
            runSelectedMapAudit,
            projectSelectedMapAuditModelHandoff,
          } = await import('./engine/packages/orchestrator/src/map-audit-pipeline.ts');
          if (typeof runSelectedMapAudit !== 'function' ||
              typeof projectSelectedMapAuditModelHandoff !== 'function') {
            throw new Error('Canonical audit entrypoint exports are unavailable');
          }
          NODE

      # The pinned LevelDB binding is the ONLY lifecycle script explicitly
      # restored. An optional native failure must not masquerade as a full
      # Bedrock world-DB scan, nor block transport of the rest of the source.
      - name: Restore pinned optional LevelDB native binding
        id: leveldb-build
        continue-on-error: true
        run: npm rebuild @8crafter/leveldb-zlib --foreground-scripts --no-audit --no-fund

      - name: Verify LevelDB loads and reads disposable synthetic data
        id: leveldb-smoke
        continue-on-error: true
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { LevelDB } from '@8crafter/leveldb-zlib';
          import { mkdtemp, rm } from 'node:fs/promises';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          const root = await mkdtemp(join(tmpdir(), 'm-lazy-leveldb-'));
          try {
            const db = new LevelDB(join(root, 'db'), { createIfMissing: true });
            await db.open();
            try {
              await db.put('portable-reader-check', 'ok');
              if (await db.getAsString('portable-reader-check') !== 'ok') {
                throw new Error('Native LevelDB scratch readback disagrees');
              }
            } finally {
              await db.close();
            }
          } finally {
            await rm(root, { recursive: true, force: true });
          }
          NODE

      - name: Build portable archive with exact commit and capability provenance
        shell: bash
        env:
          LEVELDB_BUILD_OUTCOME: ${{ steps.leveldb-build.outcome }}
          LEVELDB_SMOKE_OUTCOME: ${{ steps.leveldb-smoke.outcome }}
          AUDIT_ENTRYPOINT_OUTCOME: ${{ steps.audit-entrypoint.outcome }}
        run: |
          set -euo pipefail
          git diff --exit-code -- package.json package-lock.json
          mkdir -p .portable-node "$RUNNER_TEMP/portable-source"
          cp "$(command -v node)" .portable-node/node
          chmod 755 .portable-node/node
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const lockSha256 = createHash('sha256')
            .update(readFileSync('package-lock.json')).digest('hex');
          const ready = process.env.LEVELDB_SMOKE_OUTCOME === 'success';
          const provenance = {
            schemaVersion: 2,
            repository: process.env.GITHUB_REPOSITORY,
            branch: process.env.GITHUB_REF_NAME,
            commit: process.env.GITHUB_SHA,
            archiveFormat: 'tar.gz',
            nodeVersion: process.version,
            platform: process.platform,
            architecture: process.arch,
            packageLockSha256: lockSha256,
            dependencyInstall: 'npm ci --ignore-scripts --include=optional',
            canonicalAuditEntrypoint: {
              module: 'engine/packages/orchestrator/src/map-audit-pipeline.ts',
              importOutcome: process.env.AUDIT_ENTRYPOINT_OUTCOME,
              loadable: process.env.AUDIT_ENTRYPOINT_OUTCOME === 'success',
              proof: 'MODULE_IMPORT_ONLY_NOT_A_MAP_AUDIT',
            },
            nativeLevelDb: {
              package: '@8crafter/leveldb-zlib',
              buildOutcome: process.env.LEVELDB_BUILD_OUTCOME,
              scratchReadOutcome: process.env.LEVELDB_SMOKE_OUTCOME,
              available: ready,
              proof: 'NATIVE_SCRATCH_READ_NOT_MINECRAFT_WORLD_SCAN',
            },
            selectedMapIncluded: false,
            proofLevel: 'PORTABLE_SOURCE_AND_DEPENDENCIES_NOT_A_MAP_AUDIT',
          };
          const bytes = JSON.stringify(provenance, null, 2) + '\n';
          writeFileSync('.portable-provenance.json', bytes);
          writeFileSync(join(process.env.RUNNER_TEMP, 'portable-source', 'provenance.json'), bytes);
          NODE
          # A TAR retains executable mode, symlinks and native .node binaries;
          # the GitHub artifact ZIP otherwise discards Unix file permissions.
          tar -czf "$RUNNER_TEMP/portable-source/repository.tar.gz" \
            --exclude='./.git' \
            --exclude='./workspace/projects' \
            --exclude='*.mcworld' \
            --exclude='*.mcpack' \
            --exclude='*.mcaddon' \
            -C "$GITHUB_WORKSPACE" .
          cd "$RUNNER_TEMP/portable-source"
          sha256sum repository.tar.gz > repository.sha256
          sha256sum --check repository.sha256
          echo 'Portable package created. This job does not execute runSelectedMapAudit, Vitest or Minecraft.'

      - name: Upload ChatGPT-portable source and dependencies
        uses: actions/upload-artifact@v7
        with:
          name: lazy-developer-portable
          path: ${{ runner.temp }}/portable-source/
          retention-days: 30
          if-no-files-found: error
